name: billsplit

services:
  app:
    # Pinned explicitly so Compose uses the image rebuild.sh builds with buildx
    # rather than deriving a name and trying (and failing) to build it itself.
    # The build: block is kept only as a manual fallback; the deploy path passes
    # --no-build so Compose never runs its own (maybe non-BuildKit) build.
    image: billsplit-app:latest
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    ports:
      - "8090:8000"
    env_file: .env
    volumes:
      - ./data/uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-billsplit}
      POSTGRES_USER: ${POSTGRES_USER:-billsplit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-billsplit}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

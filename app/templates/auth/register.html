{% extends "base.html" %}
{% block title %}Create Account — BillSplit{% endblock %}
{% block content %}
<div class="min-h-screen flex flex-col justify-center px-6 py-12">
  <div class="mb-8 text-center">
    <h1 class="text-3xl font-bold text-indigo-600">BillSplit</h1>
    <p class="text-gray-500 mt-1 text-sm">Split bills without the drama</p>
  </div>

  <div class="bg-white rounded-2xl shadow-sm p-6">
    <h2 class="text-xl font-semibold text-gray-900 mb-6">Create account</h2>

    {% if error %}
    <div class="mb-4 px-4 py-3 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm">{{ error }}</div>
    {% endif %}

    <form method="post" action="/auth/register" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Your name</label>
        <input type="text" name="display_name" value="{{ display_name or '' }}" required autocomplete="name"
               class="w-full px-4 py-3 rounded-xl border border-gray-300 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" name="email" value="{{ email or '' }}" required autocomplete="email"
               class="w-full px-4 py-3 rounded-xl border border-gray-300 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password <span class="text-gray-400 font-normal">(min 8 characters)</span></label>
        <input type="password" name="password" required autocomplete="new-password"
               class="w-full px-4 py-3 rounded-xl border border-gray-300 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
      </div>
      <button type="submit"
              class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-base transition-colors">
        Create Account
      </button>
    </form>

    <p class="mt-5 text-center text-sm text-gray-500">
      Already have an account? <a href="/auth/login" class="text-indigo-600 font-medium">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}{{ bill.title }} — BillSplit{% endblock %}
{% block content %}
<div class="px-4 pt-6 pb-4">
  <!-- Header -->
  <div class="flex items-center gap-3 mb-2">
    <a href="/groups/{{ bill.group_id }}" class="p-2 -ml-2 text-gray-400">
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/>
      </svg>
    </a>
    <div class="flex-1 min-w-0">
      <h1 class="text-xl font-bold text-gray-900 truncate">{{ bill.title }}</h1>
      <p class="text-xs text-gray-400">Paid by {{ payer.display_name }} · {{ bill.created_at.strftime('%b %d, %Y') }}</p>
    </div>
    <!-- Share button -->
    <button x-data
      @click="
        navigator.clipboard.writeText('{{ request.base_url }}bills/share/{{ bill.share_token }}');
        $el.querySelector('span').textContent = 'Copied!';
        setTimeout(() => $el.querySelector('span').textContent = 'Share', 2000)
      "
      class="flex items-center gap-1 text-sm font-medium text-indigo-600 px-3 py-1.5 border border-indigo-200 rounded-xl flex-shrink-0">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 1 0 0 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186 9.566-5.314m-9.566 7.5 9.566 5.314m0 0a2.25 2.25 0 1 0 3.935 2.186 2.25 2.25 0 0 0-3.935-2.186Zm0-12.814a2.25 2.25 0 1 0 3.933-2.185 2.25 2.25 0 0 0-3.933 2.185Z"/>
      </svg>
      <span>Share</span>
    </button>
  </div>

  <!-- Scan receipt section -->
  <div x-data="{ open: false }" class="mb-3">
    <button @click="open = !open"
            class="w-full flex items-center justify-center gap-2 py-2.5 border border-dashed border-indigo-300 rounded-xl text-sm font-medium text-indigo-600 bg-indigo-50">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z"/>
      </svg>
      Scan Receipt with AI
    </button>

    <div x-show="open" x-cloak class="mt-2 space-y-3">
      <form
        hx-post="/bills/{{ bill.id }}/scan"
        hx-target="#scan-results"
        hx-swap="innerHTML"
        hx-encoding="multipart/form-data"
        class="flex gap-2">
        <label class="flex-1 flex items-center justify-center gap-2 px-4 py-3 border border-gray-300 rounded-xl text-sm text-gray-600 bg-white cursor-pointer">
          <svg class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5"/>
          </svg>
          <span>Choose photo or take one</span>
          <input type="file" name="image" accept="image/*" capture="environment" required class="hidden"
                 onchange="this.previousElementSibling.textContent = this.files[0]?.name || 'Choose photo'">
        </label>
        <button type="submit"
                class="px-4 py-3 bg-indigo-600 text-white rounded-xl text-sm font-medium flex-shrink-0 htmx-indicator-parent">
          <span class="htmx-indicator hidden">...</span>
          <span>Analyze</span>
        </button>
      </form>

      <div id="scan-results"></div>
    </div>
  </div>

  <!-- Main bill content (HTMX target) -->
  <div id="bill-main-content">
    {% include "partials/bill_content.html" %}
  </div>
</div>
{% endblock %}

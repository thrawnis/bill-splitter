{% extends "base.html" %}
{% block title %}New Group — BillSplit{% endblock %}
{% block content %}
<div class="px-4 pt-6">
  <div class="flex items-center gap-3 mb-6">
    <a href="/groups" class="p-2 -ml-2 text-gray-400">
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/>
      </svg>
    </a>
    <h1 class="text-xl font-bold text-gray-900">New Group</h1>
  </div>

  <div class="bg-white rounded-2xl shadow-sm p-6">
    {% if error %}
    <div class="mb-4 px-4 py-3 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm">{{ error }}</div>
    {% endif %}

    <form method="post" action="/groups" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Group name</label>
        <input type="text" name="name" placeholder="e.g. House, Trip to Vegas, Lunch crew…" required autofocus
               class="w-full px-4 py-3 rounded-xl border border-gray-300 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
      </div>
      <p class="text-xs text-gray-400">You can invite others after creating the group.</p>
      <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-base transition-colors">
        Create Group
      </button>
    </form>
  </div>
</div>
{% endblock %}
